<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Say Hello!</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --grad-start: #6a5af9;
      --grad-mid:   #c44bff;
      --grad-end:   #00d4ff;
      --btn-left:   #e040fb;
      --btn-right:  #00e5ff;
      --text-dark:  #1a1a2e;
      --text-muted: #9499b0;
      --border:     #e2e4f0;
      --white:      #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5b5bd6 0%, #b44cf0 50%, #3dd6f5 100%);
      font-family: 'DM Sans', sans-serif;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 2.8rem 2.5rem 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 80px rgba(90,50,180,0.25);
      animation: cardIn 0.6s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(30px) scale(.97); }
      to   { opacity:1; transform:translateY(0)   scale(1);   }
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }

    .field { margin-bottom: 1.4rem; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      letter-spacing: 0.3px;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--border);
      outline: none;
      padding: 0.5rem 0 0.65rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      background: transparent;
      transition: border-color 0.25s;
      border-radius: 0;
      -webkit-appearance: none;
    }

    input::placeholder,
    textarea::placeholder { color: var(--border); }

    input:focus,
    select:focus,
    textarea:focus { border-bottom-color: var(--grad-mid); }

    select {
      cursor: pointer;
      color: var(--text-dark);
      font-weight: 500;
    }

    /* Custom select arrow */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '⇅';
      position: absolute;
      right: 4px;
      bottom: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      padding-top: 0.5rem;
    }

    /* Submit button */
    .btn-wrap { margin-top: 2rem; }

    .btn {
      width: 100%;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(to right, var(--btn-left), var(--btn-right));
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
      box-shadow: 0 8px 28px rgba(196,75,255,0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(196,75,255,0.55);
      filter: brightness(1.06);
    }

    .btn:active { transform: translateY(0); }

    .btn .arrow {
      display: inline-flex;
      align-items: center;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }

    .btn:hover .arrow { transform: translateX(4px); }

    /* Success toast */
    .toast {
      display: none;
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a2e;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Error styles */
    .field.error input,
    .field.error select,
    .field.error textarea {
      border-bottom-color: #ff4d6d;
    }

    .err-msg {
      color: #ff4d6d;
      font-size: 0.72rem;
      margin-top: 0.3rem;
      display: none;
    }

    .field.error .err-msg { display: block; }
  </style>
</head>
<body>

<div class="card">
  <h1>Say Hello!</h1>

  <div class="field" id="f-name">
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name" autocomplete="name"/>
    <span class="err-msg">Ismingizni kiriting</span>
  </div>

  <div class="field" id="f-email">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email address" autocomplete="email"/>
    <span class="err-msg">To'g'ri email kiriting</span>
  </div>

  <div class="field" id="f-service">
    <label for="service">Needed Services</label>
    <div class="select-wrap">
      <select id="service">
        <option value="">Choose Services</option>
        <option value="web">Web Development</option>
        <option value="mobile">Mobile App</option>
        <option value="design">UI/UX Design</option>
        <option value="seo">SEO & Marketing</option>
        <option value="consulting">Consulting</option>
      </select>
    </div>
    <span class="err-msg">Xizmat turini tanlang</span>
  </div>

  <div class="field" id="f-budget">
    <label for="budget">Budget</label>
    <div class="select-wrap">
      <select id="budget">
        <option value="">Select Budget</option>
        <option value="500">$500 – $1,000</option>
        <option value="1000">$1,000 – $5,000</option>
        <option value="5000">$5,000 – $10,000</option>
        <option value="10000">$10,000+</option>
      </select>
    </div>
    <span class="err-msg">Byudjetni tanlang</span>
  </div>

  <div class="field" id="f-message">
    <label for="message">Message</label>
    <textarea id="message" placeholder="Your message here..."></textarea>
    <span class="err-msg">Xabar kiriting</span>
  </div>

  <div class="btn-wrap">
    <button class="btn" id="submitBtn" onclick="handleSubmit()">
      Submit <span class="arrow">→</span>
    </button>
  </div>
</div>

<div class="toast" id="toast">✅ Xabaringiz yuborildi!</div>

<script>
  function validate() {
    let ok = true;

    const fields = [
      { id: 'f-name',    el: document.getElementById('name'),    check: v => v.trim().length >= 2 },
      { id: 'f-email',   el: document.getElementById('email'),   check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
      { id: 'f-service', el: document.getElementById('service'), check: v => v !== '' },
      { id: 'f-budget',  el: document.getElementById('budget'),  check: v => v !== '' },
      { id: 'f-message', el: document.getElementById('message'), check: v => v.trim().length >= 5 },
    ];

    fields.forEach(({ id, el, check }) => {
      const wrap = document.getElementById(id);
      if (!check(el.value)) {
        wrap.classList.add('error');
        ok = false;
      } else {
        wrap.classList.remove('error');
      }
    });

    return ok;
  }

  // Remove error on input
  ['name','email','service','budget','message'].forEach(id => {
    const el = document.getElementById(id);
    const field = document.getElementById('f-' + id);
    el.addEventListener('input', () => field.classList.remove('error'));
    el.addEventListener('change', () => field.classList.remove('error'));
  });

  function handleSubmit() {
    if (!validate()) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span style="opacity:.7">Yuborilmoqda...</span>';

    // Simulate API call (replace with real fetch to your backend)
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = 'Submit <span class="arrow">→</span>';

      // Clear form
      ['name','email','message'].forEach(id => document.getElementById(id).value = '');
      ['service','budget'].forEach(id => document.getElementById(id).selectedIndex = 0);

      // Show toast
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }, 1200);
  }
</script>
</body>
</html>
